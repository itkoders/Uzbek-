name: AlfaPlay Android Release AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ALFAPLAY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ALFAPLAY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALFAPLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ALFAPLAY_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ALFAPLAY_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing ALFAPLAY_STORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ALFAPLAY_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ALFAPLAY_KEY_PASSWORD" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL: release requires the real backend" && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Missing SUPABASE_ANON_KEY: release requires the real backend" && exit 1)
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/alfaplay-release.jks

      - name: Build signed Play Store bundle
        env:
          ALFAPLAY_KEYSTORE_FILE: app/keystore/alfaplay-release.jks
          ALFAPLAY_STORE_PASSWORD: ${{ secrets.ALFAPLAY_STORE_PASSWORD }}
          ALFAPLAY_KEY_ALIAS: ${{ secrets.ALFAPLAY_KEY_ALIAS }}
          ALFAPLAY_KEY_PASSWORD: ${{ secrets.ALFAPLAY_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle --no-daemon --no-configuration-cache \
            -PSUPABASE_URL="$SUPABASE_URL" \
            -PSUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: AlfaPlay-v1.0.0-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -f app/keystore/alfaplay-release.jks
